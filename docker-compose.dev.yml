services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: klipmatic

    volumes:
      - klipmatic-postgres:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d klipmatic"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  migrate:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./packages/db/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ "$(psql -h postgres -U postgres -d klipmatic -tAc "select to_regclass('public.jobs')")" != "jobs" ]; then
          psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d klipmatic -f /migrations/0000_init.sql
        fi
        if [ "$(psql -h postgres -U postgres -d klipmatic -tAc "select to_regclass('public.media_assets')")" != "media_assets" ]; then
          psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d klipmatic -f /migrations/0001_media_assets.sql
        fi
        if [ "$(psql -h postgres -U postgres -d klipmatic -tAc "select 1 from information_schema.columns where table_name = 'clip_candidates' and column_name = 'thumbnail_status'")" != "1" ]; then
          psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d klipmatic -f /migrations/0002_candidate_previews.sql
        fi
        if [ "$(psql -h postgres -U postgres -d klipmatic -tAc "select 1 from information_schema.columns where table_name = 'clip_candidates' and column_name = 'preview_status'")" != "1" ]; then
          psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d klipmatic -f /migrations/0003_candidate_preview_renders.sql
        fi
        if [ "$(psql -h postgres -U postgres -d klipmatic -tAc "select 1 from information_schema.columns where table_name = 'sources' and column_name = 'provider'")" != "1" ]; then
          psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d klipmatic -f /migrations/0004_source_provenance.sql
        fi
        if [ "$(psql -h postgres -U postgres -d klipmatic -tAc "select 1 from information_schema.columns where table_name = 'media_segments' and column_name = 'is_fixture'")" != "1" ]; then
          psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d klipmatic -f /migrations/0005_segment_provenance.sql
        fi

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000

    volumes:
      - klipmatic-minio:/data

  worker:
    build:
      context: .
      dockerfile: apps/downloader/Dockerfile
    image: klipmatic-worker:dev
    restart: unless-stopped
    init: true
    working_dir: /work/apps/downloader
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/klipmatic
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_BUCKET: klipmatic
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
      HF_HOME: /work/.cache/huggingface
      # Free deployment: local faster-whisper is the default; disable any
      # legacy hosted transcription providers inherited from .env.
      TRANSCRIBE_PROVIDERS: ""
      TRANSCRIBE_DEEPINFRA_URL: ""
      TRANSCRIBE_DEEPINFRA_KEY: ""
      TRANSCRIBE_DEEPINFRA_MODEL: ""
      TRANSCRIBE_DEEPINFRA_USD_PER_MIN: "0"
      TRANSCRIBE_GROQ_URL: ""
      TRANSCRIBE_GROQ_KEY: ""
      TRANSCRIBE_GROQ_MODEL: ""
      TRANSCRIBE_GROQ_USD_PER_MIN: "0"
      # Local smoke-test fallback when YouTube blocks yt-dlp/transcript access.
      GUEST_FALLBACK_ON_SOURCE_BLOCKED: "true"
      COBALT_URL: ${COBALT_URL:-http://cobalt:9000}
      YOUTUBE_ADAPTER_URL: ${YOUTUBE_ADAPTER_URL:-http://youtube-adapter:8787}
      YTDLP_EXTRACTOR_ARGS: ${YTDLP_EXTRACTOR_ARGS:-youtubepot-bgutilhttp:base_url=http://bgutil-pot:4416}
    volumes:
      - .:/work
      - worker-venv:/venv
    command: uv run python -m app.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      bgutil-pot:
        condition: service_started
    stop_grace_period: 20s

  bgutil-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    init: true


  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    restart: unless-stopped
    init: true
    environment:
      API_URL: http://cobalt:9000/
      API_AUTH_REQUIRED: "false"


  youtube-adapter:
    build:
      context: ./apps/youtube-adapter
    restart: unless-stopped
    init: true
    environment:
      PORT: 8787

volumes:
  klipmatic-postgres:
  klipmatic-minio:
  worker-venv:
