[project]
name = "klipmatic-downloader"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary,pool]>=3.2",
  "boto3>=1.35",
  "httpx>=0.27",
  "cryptography>=43.0",
  # Di-pin sesuai spec §9.2. Pembaruan adalah perubahan tersendiri yang
  # disengaja, dipicu oleh healthcheck kanari harian.
  "yt-dlp[default]==2026.7.4",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
